<!doctype html><html><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:Arial,sans-serif;margin:0;background:#f6f7fb;color:#17202a}.app{display:flex;min-height:100vh}.side{width:240px;background:#111b35;color:#dbe4ff;padding:24px 16px}.brand{font-weight:700;font-size:20px;margin-bottom:32px}.nav button{display:block;width:100%;border:0;background:none;color:inherit;text-align:left;padding:12px;border-radius:10px;margin:4px 0;cursor:pointer}.nav button.active,.nav button:hover{background:#24345f;color:white}.main{flex:1;padding:28px;max-width:1400px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:white;border:1px solid #e7eaf2;border-radius:16px;padding:18px;box-shadow:0 8px 24px #1a2a4b0b}.calendar{margin-top:18px}.days,.weeks{display:grid;grid-template-columns:repeat(7,1fr)}.days div{padding:10px;color:#7d8799;font-size:12px}.cell{min-height:92px;background:#fff;border:1px solid #edf0f5;padding:8px}.event{font-size:11px;padding:6px;border-radius:8px;margin-top:5px;cursor:pointer;background:#eef2ff;color:#4056a1}.event.paid{background:#e9f8ef;color:#217443}.event.overdue{background:#fff0ee;color:#a33a34}.modal{position:fixed;inset:0;background:#10182b77;display:none;align-items:center;justify-content:center}.modal.open{display:flex}.dialog{background:white;border-radius:18px;padding:24px;width:min(520px,calc(100% - 32px))}.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eef0f4}button.primary{background:#334fb4;color:white;border:0;padding:10px 15px;border-radius:9px;cursor:pointer}@media(max-width:760px){.side{width:64px}.side span{display:none}.main{padding:16px}.grid{grid-template-columns:1fr}.cell{min-height:70px}}</style></head><body><div class="app"><aside class="side"><div class="brand">A<span>ME</span></div><div class="nav" id="nav"></div></aside><main class="main"><div class="top"><div><small>Tuesday, 10 September 2026</small><h1 id="heading">Dashboard</h1></div><button class="primary" onclick="loadData()">Sync Sheets</button></div><section id="content"></section></main></div><div class="modal" id="modal"><div class="dialog"><div class="top"><h2 id="modalTitle">Detail</h2><button onclick="closeModal()">×</button></div><div id="modalBody"></div></div></div><script>const menu=['Dashboard','Pusat Kontrol Budgeting','Pusat Kontrol Input Transaksi','Cicilan / Investor / Pinjaman','Analytics','Settings'];let items=[];let active='Dashboard';function boot(){document.getElementById('nav').innerHTML=menu.map(x=>`<button class="${x===active?'active':''}" onclick="select('${x}')">${x}</button>`).join('');loadData()}function loadData(){if(window.google){google.script.run.withSuccessHandler(r=>{items=r.items||[];render()}).getPortalData()}else render()}function select(x){active=x;boot()}function render(){document.getElementById('heading').textContent=active;document.getElementById('content').innerHTML=active==='Dashboard'?dashboard():`<div class="card"><h2>${active}</h2><p>Modul ini siap dihubungkan ke sheet terkait pada tahap berikutnya.</p></div>`}function dashboard(){const counts={paid:items.filter(x=>x.status==='paid').length,pending:items.filter(x=>x.status==='pending').length,overdue:items.filter(x=>x.status==='overdue').length};return `<div class="grid"><div class="card"><small>Total terjadwal</small><h2>${items.length}</h2></div><div class="card"><small>Menunggu pembayaran</small><h2>${counts.pending}</h2></div><div class="card"><small>Perlu perhatian</small><h2>${counts.overdue}</h2></div></div><div class="card calendar"><h2>Payment Tracker</h2><div class="days">${['Min','Sen','Sel','Rab','Kam','Jum','Sab'].map(x=>`<div>${x}</div>`).join('')}</div><div class="weeks">${calendar()}</div></div>`}function calendar(){const d=new Date(2026,8,1),offset=d.getDay(),days=new Date(2026,9,0).getDate();let out='';for(let i=0;i<offset;i++)out+='<div class="cell"></div>';for(let day=1;day<=days;day++){const date=`2026-09-${String(day).padStart(2,'0')}`;out+=`<div class="cell"><b>${day}</b>${items.filter(x=>x.date===date).map(x=>`<div class="event ${x.status}" onclick='openModal(${JSON.stringify(x)})'>${x.title}</div>`).join('')}</div>`}return out}function openModal(x){document.getElementById('modalTitle').textContent=x.title;document.getElementById('modalBody').innerHTML=`<div class="row"><span>Tanggal</span><b>${x.date}</b></div><div class="row"><span>Nominal</span><b>Rp ${Number(x.amount||0).toLocaleString('id-ID')}</b></div><div class="row"><span>Status</span><b>${x.status}</b></div><p>${x.notes||'Belum ada catatan.'}</p><input type="file" onchange="upload(this,'${x.id}')">`;document.getElementById('modal').classList.add('open')}function closeModal(){document.getElementById('modal').classList.remove('open')}function upload(input,id){if(!input.files[0])return;alert('Upload siap diproses melalui endpoint uploadAttachment di Code.gs.')}boot();</script></body></html>
